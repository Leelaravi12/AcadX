<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AcadX - Student Portfolio</title>

    <link rel="stylesheet" href="student-profile.css">

</head>

<body>
    <header class="portfolio-navbar">

    <div class="portfolio-logo">
        AcadX
    </div>

    <a href="student.html">
        ← Back to Profile
    </a>

</header>

    <main class="portfolio-page">

        <!-- Header -->

        <section class="portfolio-header">

            <div class="portfolio-avatar">
                👤
            </div>

            <div>

                <h1 id="portfolio-name">
                    Student Name
                </h1>

                <p id="portfolio-branch">
                    Computer Science & Engineering
                </p>

                <p id="portfolio-college">
                    College Name
                </p>

                <p id="portfolio-year">
                    2nd Year
                </p>

            </div>

        </section>


        <!-- About -->

        <section class="portfolio-section">

            <h2>About Me</h2>

            <p id="portfolio-about">
                Welcome to my AcadX portfolio.
            </p>

        </section>


        <!-- Skills -->

        <section class="portfolio-section">

            <h2>Skills</h2>

            <div id="portfolio-skills"
                 class="portfolio-skills">
            </div>

        </section>


        <!-- Projects -->

        <section class="portfolio-section">

            <h2>Projects</h2>

            <div id="portfolio-projects">
            </div>

        </section>


        <!-- Certifications -->

        <section class="portfolio-section">

            <h2>Certifications</h2>

            <div id="portfolio-certifications">
            </div>

        </section>


        <!-- Achievements -->

        <section class="portfolio-section">

            <h2>Achievements</h2>

            <div id="portfolio-achievements">
            </div>

        </section>

    </main>

    <script src="portfolio.js"></script>

</body>

</html>
