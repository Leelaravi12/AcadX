<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AcadX - Skill Assessment</title>

    <link rel="stylesheet" href="assessment.css">
</head>

<body>

    <main class="assessment-page">

        <section class="welcome-card">

                <div>
                    <strong>10</strong>

                <div>
